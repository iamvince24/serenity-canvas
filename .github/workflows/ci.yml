name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          tags: serenity-canvas-ci:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Lint
        run: docker run --rm serenity-canvas-ci:latest pnpm lint

      - name: Typecheck
        run: docker run --rm serenity-canvas-ci:latest pnpm typecheck

      - name: Unit tests
        run: docker run --rm serenity-canvas-ci:latest pnpm test

      - name: Build
        run: |
          docker run --rm \
            --env VITE_SUPABASE_URL \
            --env VITE_SUPABASE_ANON_KEY \
            --env NEXT_PUBLIC_SUPABASE_URL \
            --env NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --env NEXT_PUBLIC_SITE_URL \
            --env NEXT_PUBLIC_APP_URL \
            serenity-canvas-ci:latest pnpm build
