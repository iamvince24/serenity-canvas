name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          tags: serenity-canvas-ci:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Dependency audit
        run: docker run --rm serenity-canvas-ci:latest pnpm audit --audit-level=high

      - name: Lint
        run: docker run --rm serenity-canvas-ci:latest pnpm lint

      - name: Typecheck
        run: docker run --rm serenity-canvas-ci:latest pnpm typecheck

      - name: Unit tests
        run: docker run --rm serenity-canvas-ci:latest pnpm test

      - name: Build (retain container for artifacts)
        id: ci_build
        run: |
          CID=$(docker create \
            -e VITE_SUPABASE_URL \
            -e VITE_SUPABASE_ANON_KEY \
            -e NEXT_PUBLIC_SUPABASE_URL \
            -e NEXT_PUBLIC_SUPABASE_ANON_KEY \
            -e NEXT_PUBLIC_SITE_URL \
            -e NEXT_PUBLIC_APP_URL \
            serenity-canvas-ci:latest \
            pnpm build)
          docker start -ai "$CID"
          echo "container_id=$CID" >> "$GITHUB_OUTPUT"

      - name: Extract required build artifacts
        run: |
          CID="${{ steps.ci_build.outputs.container_id }}"
          mkdir -p artifacts/web-dist artifacts/mcp-dist
          docker cp "$CID:/app/apps/web/dist/." artifacts/web-dist/
          docker cp "$CID:/app/apps/mcp-server/dist/." artifacts/mcp-dist/
          docker rm "$CID"
          test -n "$(ls -A artifacts/web-dist)" || (echo "missing apps/web/dist" && exit 1)
          test -n "$(ls -A artifacts/mcp-dist)" || (echo "missing apps/mcp-server/dist" && exit 1)

      - name: Upload build artifacts (required web + mcp)
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ github.sha }}
          path: |
            artifacts/web-dist/
            artifacts/mcp-dist/
          retention-days: 7
